name: MaterialHub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/materialhub_test
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/materialhub_test
  BETTER_AUTH_SECRET: materialhub-ci-secret-key-minimum-32-chars-2026
  BETTER_AUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000
  STORAGE_DRIVER: local

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Unit/Integration Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: materialhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Checking
        run: npm run typecheck

      - name: Apply Database Migrations
        run: npm run db:migrate

      - name: Run Unit & Integration Tests (Vitest)
        run: npm test

      - name: Validate Production Build
        run: npm run build
